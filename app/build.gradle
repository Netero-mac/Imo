plugins {
    id 'com.android.application'
}

android {
    namespace 'com.netero.magnata'
    compileSdk 34

    defaultConfig {
        applicationId 'com.netero.magnata'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
