name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Magnata-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Magnata.apk

      - name: Publicar na Release (link direto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Magnata v1.0.${{ github.run_number }}
          body: |
            Baixe o **Magnata.apk** abaixo e instale no celular.
            Todos os jogadores precisam instalar a mesma versão.
          files: Magnata.apk
          make_latest: true
